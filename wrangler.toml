name = "toolhouse-wpm"
main = "src/index.ts"
compatibility_date = "2024-12-12"

# Database binding (D1)
[[d1_databases]]
binding = "DB"
database_name = "wpm_game_db"
database_id = "YOUR_DATABASE_ID"  # Update after creating D1

# Durable Objects
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"
script_name = "toolhouse-wpm"

[env.production]
routes = [
  { pattern = "api/*", zone_name = "example.com" },
  { pattern = "example.com/*" }
]

[build]
command = "npm run build"
cwd = "."

[build.upload]
format = "service-worker"
